<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HYDROBOTICS</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body data-page="reset-password">
  <nav>
    <div class="nav-left">
      <a class="logo" href="index.html">HYDROBOTICS</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="faq.html">FAQ</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a id="authLink" class="btn-secondary" href="login.html">Login</a>
    </div>
  </nav>
  <main class="page">
    <section class="panel auth-panel">
      <h1 class="section-title">Choose a new password</h1>
      <p class="text-muted">Use the form below after opening the password-reset link sent to your email.</p>
      <div id="resetAlert" aria-live="polite"></div>
      <form id="passwordUpdateForm">
        <div class="form-row">
          <label for="newPassword">New password <span class="text-muted">(at least 8 characters)</span></label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-row">
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-actions">
          <button type="submit">Update password</button>
          <a class="btn-secondary" href="login.html">Back to sign in</a>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>If your reset link expired, request a new one from the sign-in page.</p>
    </div>
  </footer>
  <script src="js/site.js"></script>
</body>
</html>
